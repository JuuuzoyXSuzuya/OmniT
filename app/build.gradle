plugins {
    id 'com.android.application'
}

android {
    namespace 'mod.omnit.patcher'
    compileSdk 34

    defaultConfig {
        applicationId 'mod.omnit.patcher'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '0.1.0'
    }

    buildTypes {
        // Минификацию НЕ включать: патчер достаёт классы мода из собственного dex по именам.
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    packaging {
        resources {
            excludes += [
                    'META-INF/DEPENDENCIES',
                    'META-INF/LICENSE',
                    'META-INF/LICENSE.txt',
                    'META-INF/NOTICE',
                    'META-INF/NOTICE.txt',
                    'META-INF/*.md'
            ]
        }
    }
}

dependencies {
    implementation project(':hook')
    implementation 'com.android.tools.smali:smali-dexlib2:3.0.8'
    implementation 'com.android.tools.build:apksig:8.5.2'
}
