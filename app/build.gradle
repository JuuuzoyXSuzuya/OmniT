
plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.regionpatcher'
    compileSdk 35

    defaultConfig {
        applicationId 'com.example.regionpatcher'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '0.1.0'
    }
}

repositories {
    google()
    mavenCentral()
}

dependencies {
    implementation 'org.smali:dexlib2:2.5.2'
}
